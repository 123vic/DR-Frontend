<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue components</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Import axios.js -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="nav-bar"></div>

     <h1>{{ intro }}</h1>
    
     <login-form v-if="!userInfo" @login="onLogin"></login-form>
     <user-bar v-else :user-info="userInfo" @logout="logout"></user-bar>

     <search-records @search="searchRecords" ></search-records>
     <hr />
     <record-list :records="records"></record-list>
    </div>

    <!-- Import App -->
    <script src="./js/main.js"></script>
    <script src="./components/SearchRecords.js"></script>
    <script src="./components/RecordList.js"></script>
    <script src="./components/LoginForm.js"></script>
    <script src="./components/UserBar.js"></script>

    <!-- Mount App -->
    <script>
      const mountedApp = app.mount('#app')
    </script>
  </body>
</html>
