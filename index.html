<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue components</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Import axios.js -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="nav-bar"></div>

      <h1>{{ intro }}</h1>

      <h2>Search Records</h2>
      <div class="search-box">
        <input type="text" v-model="searchTitle" placeholder="Title" />
        <input type="text" v-model="searchArtist" placeholder="Artist" />
        <button id="search-button" @click="searchRecords">Search</button>
      </div>
      <h1>_____________________________</h1>
      <h2>Records List</h2>

      <button id="toggle-records" @click="showRecords = !showRecords">
        {{ showRecords ? 'Hide Records' : 'Show Records' }}
      </button>
      <div v-show="showRecords">     
        <ul>
        <li v-for="record in records" :key="record.id">
         {{ record.title }} by {{ record.artist }} ({{ record.publicationYear }}) - {{ record.duration }} sec
        </li>
        </ul> 
      </div>
    </div>

    <!-- Import App -->
    <script src="./js/main.js"></script>

    <!-- Mount App -->
    <script>
      const mountedApp = app.mount('#app')
    </script>
  </body>
</html>
